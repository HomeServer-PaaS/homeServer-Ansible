[defaults]
inventory = inventory/example/hosts.yml
roles_path = roles
collections_path = /usr/share/ansible/collections
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
fact_caching = memory
stdout_callback = default

[ssh_connection]
ssh_args = -F /tmp/ssh/config -o IdentityAgent=/ssh-agent -o IdentitiesOnly=no -o UserKnownHostsFile=/tmp/ssh/known_hosts -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
